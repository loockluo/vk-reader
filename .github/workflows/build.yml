name: 构建 VK-Reader

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 安装 pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
        
    - name: 安装根目录依赖
      run: pnpm install
      
    - name: 安装前端依赖
      run: pnpm install
      working-directory: ./web
      
    - name: 构建前端
      run: pnpm run build
      working-directory: ./web
      
    - name: 复制前端构建文件
      run: |
        if (Test-Path "public") { Remove-Item -Recurse -Force "public" }
        Copy-Item -Recurse -Force "web/build" "public"
        
    - name: 构建后端
      run: pnpm run build:js
      
    - name: 构建安装脚本
      run: pnpm run build:install
      
    - name: 创建构建目录
      run: |
        New-Item -ItemType Directory -Force -Path "build"
        Copy-Item -Recurse -Force "public" "build/"
        Copy-Item -Recurse -Force "node-v14.9.0-win-x86" "build/"
        Copy-Item "index.js" "build/"
        Copy-Item "config.json" "build/"
        Copy-Item "install.js" "build/"
        Copy-Item "install.bat" "build/"
        Copy-Item "installService.bat" "build/"
        Copy-Item "uninstall.bat" "build/"
        Copy-Item "手动安装说明.txt" "build/"
        Copy-Item "VK-reader-build.nsi" "build/"
        
    - name: 创建 ZIP 包
      run: |
        Compress-Archive -Path "build\*" -DestinationPath "VK-Reader-build.zip" -Force
        
    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: VK-Reader-build
        path: |
          VK-Reader-build.zip
          build/
        retention-days: 30
        
    - name: 创建 Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: VK-Reader-build.zip
        draft: false
        prerelease: false
