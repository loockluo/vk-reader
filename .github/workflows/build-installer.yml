name: 构建 NSIS 安装包

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 安装 pnpm
      uses: pnpm/action-setup@v2
      with:
        version: '8'
        
    - name: 安装依赖
      run: pnpm install
      
    - name: 安装前端依赖
      run: pnpm install
      working-directory: ./web
      
    - name: 构建前端
      run: pnpm run build
      working-directory: ./web
      
    - name: 复制前端构建文件
      run: |
        if (Test-Path "public") { Remove-Item -Recurse -Force "public" }
        Copy-Item -Recurse -Force "web/build" "public"
        
    - name: 构建后端
      run: pnpm run build:js
      
    - name: 构建安装脚本
      run: pnpm run build:install
      
    - name: 创建 zuiSuReader 目录
      run: |
        New-Item -ItemType Directory -Force -Path "zuiSuReader"
        Copy-Item -Recurse -Force "public" "zuiSuReader/"
        Copy-Item -Recurse -Force "node-v14.9.0-win-x86" "zuiSuReader/"
        Copy-Item "index.js" "zuiSuReader/"
        Copy-Item "config.json" "zuiSuReader/"
        Copy-Item "install.js" "zuiSuReader/"
        Copy-Item "install.bat" "zuiSuReader/"
        Copy-Item "installService.bat" "zuiSuReader/"
        Copy-Item "uninstall.bat" "zuiSuReader/"
        Copy-Item "手动安装说明.txt" "zuiSuReader/"
        
    - name: 下载 NSIS
      run: |
        $url = "https://sourceforge.net/projects/nsis/files/NSIS%203/3.08/nsis-3.08-setup.exe/download"
        $output = "nsis-3.08-setup.exe"
        Write-Host "正在下载 NSIS..."
        Write-Host "下载链接: $url"
        
        # 尝试多种下载方法
        $success = $false
        
        # 方法1: 使用 Invoke-WebRequest
        try {
          Write-Host "尝试方法1: Invoke-WebRequest"
          Invoke-WebRequest -Uri $url -OutFile $output -UseBasicParsing -TimeoutSec 300
          $success = $true
          Write-Host "方法1成功"
        } catch {
          Write-Host "方法1失败: $_"
        }
        
        # 方法2: 使用 curl
        if (-not $success) {
          try {
            Write-Host "尝试方法2: curl"
            curl -L -o $output $url
            $success = $true
            Write-Host "方法2成功"
          } catch {
            Write-Host "方法2失败: $_"
          }
        }
        
        # 方法3: 使用 wget
        if (-not $success) {
          try {
            Write-Host "尝试方法3: wget"
            wget -O $output $url
            $success = $true
            Write-Host "方法3成功"
          } catch {
            Write-Host "方法3失败: $_"
          }
        }
        
        if (-not $success) {
          Write-Error "所有下载方法都失败了"
          exit 1
        }
        
        Write-Host "下载完成"
        
    - name: 验证下载文件
      run: |
        if (Test-Path "nsis-3.08-setup.exe") {
          $fileInfo = Get-Item "nsis-3.08-setup.exe"
          Write-Host "文件大小: $($fileInfo.Length) bytes"
          Write-Host "文件大小 (MB): $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
          
          # NSIS 3.08 安装包应该大于 2MB
          if ($fileInfo.Length -lt 2000000) {
            Write-Error "下载的文件太小 ($($fileInfo.Length) bytes)，可能损坏或下载失败"
            Write-Host "尝试重新下载..."
            
            # 删除损坏的文件
            Remove-Item "nsis-3.08-setup.exe" -Force
            
            # 尝试备用下载链接
            $backupUrl = "https://github.com/NSIS-Dev/NSIS/releases/download/v3.08/nsis-3.08-setup.exe"
            Write-Host "尝试备用下载链接: $backupUrl"
            try {
              Invoke-WebRequest -Uri $backupUrl -OutFile "nsis-3.08-setup.exe" -UseBasicParsing -TimeoutSec 300
              $newFileInfo = Get-Item "nsis-3.08-setup.exe"
              Write-Host "备用下载完成，新文件大小: $($newFileInfo.Length) bytes"
              
              if ($newFileInfo.Length -lt 2000000) {
                Write-Error "备用下载也失败了"
                exit 1
              }
            } catch {
              Write-Error "备用下载失败: $_"
              exit 1
            }
          } else {
            Write-Host "文件大小验证通过"
          }
        } else {
          Write-Error "下载文件不存在"
          exit 1
        }
        
    - name: 安装 NSIS
      run: |
        Write-Host "正在安装 NSIS..."
        try {
          $process = Start-Process -FilePath ".\nsis-3.08-setup.exe" -ArgumentList "/S" -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Write-Error "NSIS 安装失败，退出代码: $($process.ExitCode)"
            exit 1
          }
          Write-Host "NSIS 安装完成"
        } catch {
          Write-Error "安装过程出错: $_"
          exit 1
        }
        
    - name: 验证 NSIS 安装
      run: |
        $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
        if (Test-Path $nsisPath) {
          Write-Host "NSIS 已安装到: $nsisPath"
          & $nsisPath /VERSION
        } else {
          Write-Error "NSIS 安装验证失败，文件不存在: $nsisPath"
          exit 1
        }
        
    - name: 构建 NSIS 安装包
      run: |
        makensis VK-reader-build.nsi
        
    - name: 验证安装包
      run: |
        if (Test-Path "Setup.exe") {
          Write-Host "安装包构建成功: Setup.exe"
          $fileInfo = Get-Item "Setup.exe"
          Write-Host "文件大小: $($fileInfo.Length) bytes"
        } else {
          Write-Error "安装包构建失败"
          exit 1
        }
        
    - name: 上传安装包
      uses: actions/upload-artifact@v4
      with:
        name: VK-Reader-Installer-${{ github.sha }}
        path: Setup.exe
        retention-days: 30
        
    - name: 创建 Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: Setup.exe
        draft: false
        prerelease: false
        generate_release_notes: true
