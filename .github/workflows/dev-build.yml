name: 开发环境构建

on:
  push:
    branches: [ develop, feature/* ]
  pull_request:
    branches: [ develop ]

jobs:
  dev-build:
    runs-on: windows-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 安装 pnpm
      uses: pnpm/action-setup@v2
      with:
        version: '8'
        
    - name: 安装依赖
      run: pnpm install
      
    - name: 安装前端依赖
      run: pnpm install
      working-directory: ./web
      
    - name: 构建前端
      run: pnpm run build
      working-directory: ./web
      
    - name: 复制前端构建文件
      run: |
        if (Test-Path "public") { Remove-Item -Recurse -Force "public" }
        Copy-Item -Recurse -Force "web/build" "public"
        
    - name: 构建后端
      run: pnpm run build:js
      
    - name: 构建安装脚本
      run: pnpm run build:install
      
    - name: 创建开发构建包
      run: |
        New-Item -ItemType Directory -Force -Path "dev-build"
        Copy-Item -Recurse -Force "public" "dev-build/"
        Copy-Item -Recurse -Force "node-v14.9.0-win-x86" "dev-build/"
        Copy-Item "index.js" "dev-build/"
        Copy-Item "config.json" "dev-build/"
        Copy-Item "install.js" "dev-build/"
        Copy-Item "install.bat" "dev-build/"
        Copy-Item "installService.bat" "dev-build/"
        Copy-Item "uninstall.bat" "dev-build/"
        Copy-Item "手动安装说明.txt" "dev-build/"
        
    - name: 创建开发 ZIP 包
      run: |
        Compress-Archive -Path "dev-build\*" -DestinationPath "VK-Reader-dev-${{ github.sha }}.zip" -Force
        
    - name: 上传开发构建产物
      uses: actions/upload-artifact@v4
      with:
        name: VK-Reader-dev-${{ github.sha }}
        path: VK-Reader-dev-${{ github.sha }}.zip
        retention-days: 7
