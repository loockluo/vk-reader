name: 测试 NSIS 安装和打包

on:
  workflow_dispatch:
  push:
    branches: [ test-nsis ]

jobs:
  test-nsis:
    runs-on: windows-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 安装 pnpm
      uses: pnpm/action-setup@v2
      with:
        version: '8'
        
    - name: 安装依赖
      run: pnpm install
      
    - name: 安装前端依赖
      run: pnpm install
      working-directory: ./web
      
    - name: 构建前端
      run: pnpm run build
      working-directory: ./web
      
    - name: 复制前端构建文件
      run: |
        if (Test-Path "public") { Remove-Item -Recurse -Force "public" }
        Copy-Item -Recurse -Force "web/build" "public"
        
    - name: 构建后端
      run: pnpm run build:js
      
    - name: 构建安装脚本
      run: pnpm run build:install
      
    - name: 创建测试目录
      run: |
        New-Item -ItemType Directory -Force -Path "test-build"
        Copy-Item -Recurse -Force "public" "test-build/"
        Copy-Item -Recurse -Force "node-v14.9.0-win-x86" "test-build/"
        Copy-Item "index.js" "test-build/"
        Copy-Item "config.json" "test-build/"
        Copy-Item "install.js" "test-build/"
        Copy-Item "install.bat" "test-build/"
        Copy-Item "installService.bat" "test-build/"
        Copy-Item "uninstall.bat" "test-build/"
        Copy-Item "手动安装说明.txt" "test-build/"
        Copy-Item "VK-reader-build.nsi" "test-build/"
        
    - name: 复制 NSIS 安装包
      run: |
        Write-Host "正在复制 NSIS 安装包..."
        if (Test-Path "scripts\nsis-3.08-setup.exe") {
          Copy-Item "scripts\nsis-3.08-setup.exe" "nsis-3.08-setup.exe"
          Write-Host "NSIS 安装包复制完成"
        } else {
          Write-Error "未找到 NSIS 安装包: scripts\nsis-3.08-setup.exe"
          exit 1
        }
        
        
    - name: 安装 NSIS
      run: |
        Write-Host "正在安装 NSIS..."
        try {
          $process = Start-Process -FilePath ".\nsis-3.08-setup.exe" -ArgumentList "/S" -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Write-Error "NSIS 安装失败，退出代码: $($process.ExitCode)"
            exit 1
          }
          Write-Host "NSIS 安装完成"
        } catch {
          Write-Error "安装过程出错: $_"
          exit 1
        }
        
    - name: 验证 NSIS 安装
      run: |
        $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
        if (Test-Path $nsisPath) {
          Write-Host "NSIS 已安装到: $nsisPath"
          & $nsisPath /VERSION
        } else {
          Write-Error "NSIS 安装验证失败，文件不存在: $nsisPath"
          exit 1
        }
        
    - name: 测试 NSIS 编译
      run: |
        Write-Host "开始测试 NSIS 编译..."
        Set-Location "test-build"
        
        # 检查 NSIS 脚本是否存在
        if (Test-Path "VK-reader-build.nsi") {
          Write-Host "找到 NSIS 脚本文件"
        } else {
          Write-Error "NSIS 脚本文件不存在"
          exit 1
        }
        
        # 尝试编译 NSIS 脚本
        try {
          Write-Host "正在编译 NSIS 脚本..."
          & "C:\Program Files (x86)\NSIS\makensis.exe" "VK-reader-build.nsi"
          Write-Host "NSIS 编译成功"
        } catch {
          Write-Error "NSIS 编译失败: $_"
          exit 1
        }
        
        # 检查生成的安装包
        if (Test-Path "Setup.exe") {
          $setupInfo = Get-Item "Setup.exe"
          Write-Host "安装包生成成功: Setup.exe"
          Write-Host "安装包大小: $($setupInfo.Length) bytes"
          Write-Host "安装包大小 (MB): $([math]::Round($setupInfo.Length / 1MB, 2)) MB"
        } else {
          Write-Error "安装包生成失败，未找到 Setup.exe"
          exit 1
        }
        
    - name: 上传测试构建产物
      uses: actions/upload-artifact@v4
      with:
        name: NSIS-Test-Build-${{ github.sha }}
        path: |
          test-build/Setup.exe
          test-build/
        retention-days: 7
        
    - name: 测试完成报告
      run: |
        Write-Host "=========================================="
        Write-Host "NSIS 测试完成报告"
        Write-Host "=========================================="
        Write-Host "✅ NSIS 下载成功"
        Write-Host "✅ NSIS 安装成功"
        Write-Host "✅ NSIS 编译成功"
        Write-Host "✅ 安装包生成成功"
        Write-Host "=========================================="
